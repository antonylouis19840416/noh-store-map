<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HIROSHIMA NOH BREWERY 卸先マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{
    --forest:#1f3d2b; --forest2:#2e5c40; --moss:#7a8c5a; --moss-l:#a7b585;
    --bg:#f4f1e9; --card:#ffffff; --ink:#243027; --muted:#6b7568; --line:#e0ddd2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100%}
  header{background:var(--forest);color:#f4f1e9;padding:12px 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;letter-spacing:.04em;font-weight:700}
  header .sub{font-size:12px;color:var(--moss-l)}
  header .count{margin-left:auto;font-size:12px;color:#dfe5d2}
  #main{flex:1;display:flex;min-height:0}
  #sidebar{width:320px;max-width:42%;overflow-y:auto;background:var(--card);border-right:1px solid var(--line)}
  #map{flex:1;min-height:0}
  .filter{padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:5}
  .filter input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .store{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .store:hover{background:#f0efe7}
  .store.flagged{background:#fbf6ee}
  .store .nm{font-weight:700;font-size:14px;margin:0 0 3px}
  .store .ad{font-size:12px;color:var(--muted);line-height:1.4}
  .store .meta{font-size:11px;color:var(--moss);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;background:var(--moss-l);color:#2a3320}
  .badge.warn{background:#e8b04b;color:#3a2a00}
  .links a{display:inline-block;margin-top:5px;margin-right:6px;font-size:11px;text-decoration:none;
           padding:3px 9px;border-radius:7px;border:1px solid var(--moss);color:var(--forest2)}
  .links a.ig{background:var(--forest2);color:#fff;border-color:var(--forest2)}
  .pop .nm{font-weight:700;font-size:14px;margin-bottom:3px}
  .pop .ad{font-size:12px;color:#555;margin-bottom:6px}
  .pop a{font-size:12px;margin-right:8px}
  footer{font-size:11px;color:var(--muted);padding:6px 14px;background:var(--card);border-top:1px solid var(--line)}
  @media(max-width:680px){
    #main{flex-direction:column}
    #sidebar{width:100%;max-width:none;max-height:42%;border-right:none;border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>HIROSHIMA NOH BREWERY</h1>
    <span class="sub">お取扱店マップ</span>
    <span class="count" id="hdrcount"></span>
  </header>
  <div id="main">
    <aside id="sidebar">
      <div class="filter"><input id="q" type="search" placeholder="店名・地域で絞り込み"></div>
      <div id="list"></div>
    </aside>
    <div id="map"></div>
  </div>
  <footer id="foot"></footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const DATA = {"brewery": "HIROSHIMA NOH BREWERY", "generated": "2026-06-15", "public": true, "stores": [{"name": "THE SMITH", "address": "広島県広島市中区立町5-7 Gハウスビル 2F", "lat": 34.393448, "lng": 132.461365, "ig": "https://www.instagram.com/the_smith_lab/", "hp": "", "link": "https://www.instagram.com/the_smith_lab/", "tel": "082-249-8199", "area": "広島県広島市"}, {"name": "お好み焼き居酒屋 こっちゃん所", "address": "広島県三次市十日市中2-8-11", "lat": 34.805984, "lng": 132.85202, "ig": "https://www.instagram.com/kocchantoko/", "hp": "", "link": "https://www.instagram.com/kocchantoko/", "tel": "080-6415-2607", "area": "広島県三次市"}, {"name": "くずし割烹 さくら縁", "address": "広島県三次市十日市東1丁目3-21 蜂郷ビル1F", "lat": 34.804127, "lng": 132.858521, "ig": "https://www.instagram.com/kuzusi.kappou.sakura.en/", "hp": "https://sakuraen1715.jimdofree.com/", "link": "https://www.instagram.com/kuzusi.kappou.sakura.en/", "tel": "0824-53-1715", "area": "広島県三次市"}, {"name": "しかぱん", "address": "奈良県 奈良市 餅飯殿町 12番地 夢Cube J号店舗", "lat": 34.68055, "lng": 135.829178, "ig": "", "hp": "", "link": "", "tel": "070-4395-5528", "area": ""}, {"name": "ひろしま夢ぷらざ", "address": "広島県広島市中区本通8-28", "lat": 34.392956, "lng": 132.459335, "ig": "https://www.instagram.com/hiroshimayumeplaza/", "hp": "https://www.yumeplaza.com/", "link": "https://www.instagram.com/hiroshimayumeplaza/", "tel": "082-544-1122", "area": "広島県広島市"}, {"name": "めぐる酒店", "address": "広島県広島市西区己斐本町1-25-9", "lat": 34.396759, "lng": 132.427261, "ig": "https://www.instagram.com/megurusaketen/", "hp": "https://www.megurusake.jp", "link": "https://www.instagram.com/megurusaketen/", "tel": "082-273-5566", "area": "広島県広島市"}, {"name": "ゆめマート はなわ　三次東", "address": "広島県三次市三次町129-1", "lat": 34.819317, "lng": 132.850388, "ig": "https://www.instagram.com/hanawa_youme_miyosihigasiten/", "hp": "http://youmemart-hanawa.com/shop/miyoshihigashi/", "link": "https://www.instagram.com/hanawa_youme_miyosihigasiten/", "tel": "0824-53-1212", "area": "広島県三次市"}, {"name": "カフェ・ブランシュ", "address": "広島県広島市安佐南区祇園5丁目3-26 森のアト  "https://www.instagram.com/ittokuhonpo/", "hp": "https://ittoku-go.com/?p=2905", "link": "https://www.instagram.com/ittokuhonpo/", "tel": "0848-29-5109", "area": "広島県尾道市"}, {"name": "庄原酒販有限会社", "address": "広島県庄原市中本町1丁目8-1", "lat": 34.858971, "lng": 133.016968, "ig": "", "hp": "", "link": "", "tel": "0824-72-2183", "area": "広島県庄原市"}, {"name": "有限会社 ももや", "address": "広島県広島市西区観音町8-3", "lat": 34.394829, "lng": 132.440933, "ig": "", "hp": "", "link": "", "tel": "082-231-0843", "area": "広島県広島市"}, {"name": "株式会社 KIMURA", "address": "広島県広島市中区羽衣町13番12号", "lat": 34.377575, "lng": 132.448532, "ig": "https://www.instagram.com/liquorland_kimura/", "hp": "https://www.liquorland.jp/", "link": "https://www.instagram.com/liquorland_kimura/", "tel": "082-241-6703", "area": "広島県広島市"}, {"name": "株式会社ええやん", "address": "大阪府 大阪市東成区 中本 1丁目10－25", "lat": 34.681168, "lng": 135.542587, "ig": "", "hp": "", "link": "", "tel": "070-8374-2957", "area": ""}, {"name": "株式会社アンデルセン", "address": "広島県広島市中区本通7-1", "lat": 34.39312, "lng": 132.458557, "ig": "https://www.instagram.com/hiroshima_andersen_official/", "hp": "https://www.andersen.co.jp/hiroshima/", "link": "https://www.instagram.com/hiroshima_andersen_official/", "tel": "082-247-2403", "area": "広島県広島市"}, {"name": "株式会社ライズ", "address": "和歌山県 新宮市 蓬莱 3-10-8", "lat": 33.722881, "lng": 135.998276, "ig": "", "hp": "", "link": "", "tel": "090-8933-3577", "area": ""}, {"name": "株式会社緑の村", "address": "広島県庄原市高野町下門田49", "lat": 35.009045, "lng": 132.87265, "ig": "https://www.instagram.com/roadside_station_takano/", "hp": "https://takanoyama.jp/", "link": "https://www.instagram.com/roadside_station_takano/", "tel": "0824-86-3131", "area": "広島県庄原市"}, {"name": "檸檬", "address": "広島県広島市中区胡町2-16 エイトバレー19 1階", "lat": 34.39241, "lng": 132.465897, "ig": "https://www.instagram.com/hiroshimaspecialitybarlemon/", "hp": "", "link": "https://www.instagram.com/hiroshimaspecialitybarlemon/", "tel": "", "area": "広島県広島市"}, {"name": "湯本豪一記念　日本妖怪博物", "address": "広島県三次市三次町1691番地4", "lat": 34.815197, "lng": 132.844955, "ig": "https://www.instagram.com/mononoke0426/", "hp": "https://miyoshi-mononoke.jp/", "link": "https://www.instagram.com/mononoke0426/", "tel": "0824-69-0111", "area": "広島県三次市"}, {"name": "酒商山田", "address": "広島県広島市南区宇品海岸2丁目10番7号", "lat": 34.354618, "lng": 132.460876, "ig": "https://www.instagram.com/sakeshowyamada/", "hp": "https://sake-japan.jp/", "link": "https://www.instagram.com/sakeshowyamada/", "tel": "082-298-1700", "area": "広島県広島市"}, {"name": "魚樽本店", "address": "広島県広島市中区薬研堀3-8", "lat": 34.390827, "lng": 132.464767, "ig": "", "hp": "https://y121501.gorp.jp/", "link": "https://y121501.gorp.jp/", "tel": "082-546-0001", "area": "広島県広島市"}, {"name": "齊藤商店", "address": "群馬県 甘楽郡甘楽町 秋畑 814-3", "lat": 36.185448, "lng": 138.874496, "ig": "", "hp": "", "link": "", "tel": "0274-64-9745", "area": ""}], "home": null, "mapped_count": 28, "total_count": 29};
const STORES = DATA.stores;

const map = L.map('map', {scrollWheelZoom:true}).setView([34.39,132.45], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function linksHtml(s, big){
  let h = '';
  if(s.ig) h += `<a class="ig" href="${esc(s.ig)}" target="_blank" rel="noopener">Instagram</a>`;
  if(s.hp) h += `<a href="${esc(s.hp)}" target="_blank" rel="noopener">HP</a>`;
  if(big && s.address) h += `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}" target="_blank" rel="noopener">経路</a>`;
  return h;
}

// マーカー
const markers = {};
const bounds = [];
const moss = L.divIcon({className:'', html:'<div style="width:16px;height:16px;border-radius:50%;background:#2e5c40;border:3px solid #fff;box-shadow:0 0 0 1px #2e5c40"></div>', iconSize:[16,16], iconAnchor:[8,8]});
STORES.forEach((s,i)=>{
  if(s.lat==null||s.lng==null) return;
  const m = L.marker([s.lat,s.lng],{icon:moss}).addTo(map);
  const info = (!DATA.public && (s.last_date||s.orders))
    ? [s.last_date?('最終出荷 '+s.last_date):'', s.orders?('出荷 '+s.orders+'回'):''].filter(Boolean).join(' / ') : '';
  m.bindPopup(`<div class="pop"><div class="nm">${esc(s.name)}</div><div class="ad">${esc(s.address)}</div>${linksHtml(s,true)||''}${info?`<div style="font-size:11px;color:#7a8c5a;margin-top:6px">${esc(info)}</div>`:''}</div>`);
  markers[i] = m; bounds.push([s.lat,s.lng]);
});

// 醸造所ピン
if(DATA.home){
  const beer = L.divIcon({className:'', html:'<div style="font-size:22px;line-height:1">🍺</div>', iconSize:[22,22], iconAnchor:[11,20]});
  L.marker([DATA.home.lat,DATA.home.lng],{icon:beer,zIndexOffset:1000}).addTo(map)
    .bindPopup(`<div class="pop"><div class="nm">${esc(DATA.home.name)}</div><div class="ad">${esc(DATA.home.address)}</div></div>`);
  bounds.push([DATA.home.lat,DATA.home.lng]);
}
if(bounds.length) map.fitBounds(bounds,{padding:[40,40],maxZoom:14});

// サイドリスト
const listEl = document.getElementById('list');
function render(filter){
  filter = (filter||'').trim().toLowerCase();
  listEl.innerHTML = '';
  let shown = 0;
  STORES.forEach((s,i)=>{
    const hay = (s.name+' '+s.address+' '+(s.area||'')).toLowerCase();
    if(filter && !hay.includes(filter)) return;
    shown++;
    const flagged = !DATA.public && ((!s.link) || (s.lat==null));
    const div = document.createElement('div');
    div.className = 'store'+(flagged?' flagged':'');
    const badges = [];
    if(s.area) badges.push('<span class="badge">'+esc(s.area)+'</span>');
    if(!DATA.public && !s.link) badges.push('<span class="badge warn">IG/HP未登録</span>');
    if(!DATA.public && s.lat==null) badges.push('<span class="badge warn">位置不明</span>');
    if(!DATA.public && s.orders) badges.push('<span class="badge">出荷'+s.orders+'回</span>');
    div.innerHTML = `<div class="nm">${esc(s.name)}</div>`+
      (s.address?`<div class="ad">${esc(s.address)}</div>`:'')+
      `<div class="meta">${badges.join('')}</div>`+
      `<div class="links">${linksHtml(s,false)}</div>`;
    div.addEventListener('click',()=>{
      if(markers[i]){ map.flyTo([s.lat,s.lng],15); markers[i].openPopup(); }
    });
    listEl.appendChild(div);
  });
  const base = DATA.public ? `${DATA.mapped_count} 店掲載` : `${DATA.mapped_count}/${DATA.total_count} 店を地図化`;
  document.getElementById('hdrcount').textContent = base + (shown!==DATA.total_count?`（表示 ${shown}）`:'');
}
document.getElementById('q').addEventListener('input', e=>render(e.target.value));
render('');

document.getElementById('foot').textContent =
  `最終更新: ${DATA.generated}　|　地図: © OpenStreetMap contributors`;
</script>
</body>
</html>
